server:
  port: 8080
spring:
  application:
    name: my-app
  datasource:
    url: jdbc:mysql://localhost:3309/ecommerce
    username: root
    password: admin
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}          # đọc từ biến môi trường (Gmail address)
    password: ${MAIL_PASSWORD}          # Gmail App Password (KHÔNG phải mật khẩu thường)
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true                # bật TLS — Gmail yêu cầu kết nối mã hóa
    # from address dùng khi gửi (đọc trong EmailService); để riêng vì 'username' có thể khác alias gửi
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB        # 1 file tối đa 5MB
      max-request-size: 25MB    # tổng request (multi-file) tối đa 25MB
  elasticsearch:
    uris: http://localhost:9200   # ES REST endpoint (single-node dev)
    connection-timeout: 5s
    socket-timeout: 30s
app:
  name: my-app
  version: "1.0"
  description: "This is learning app"
  mail:
    from: ${MAIL_USERNAME}        # địa chỉ hiển thị ở field "From" của email
jwt:
  secret: my-super-secret-key-for-jwt-must-be-at-least-256-bits-long-for-hs256
  access-token-expiration: 900000    # 15 phút (milliseconds)
  refresh-token-expiration: 604800000 # 7 ngày (milliseconds)
storage:
  type: local                   # 'local' | 's3' | 'cloudinary' (sau này)
  local:
    upload-dir: ./uploads       # folder lưu file (relative đến working dir)
    public-url-prefix: /uploads # URL prefix khi serve file qua HTTP
