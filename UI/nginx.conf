server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # SPA fallback: router dùng createBrowserRouter (History API).
    # F5 ở /products/12 -> không có file đó trên đĩa -> trả index.html cho React tự route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gọi API: cùng origin nên không cần CORS. Thay cho proxy của Vite dev server.
    location /api/ {
        proxy_pass http://ecom-api:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;   # khớp spring.servlet.multipart.max-request-size
    }

    # Ảnh sản phẩm do Spring serve tĩnh (storage.local.public-url-prefix).
    location /uploads/ {
        proxy_pass http://ecom-api:8080;
        proxy_set_header Host $host;
    }
}
